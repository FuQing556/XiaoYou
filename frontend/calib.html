<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>小悠 v2 — 参数校准</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#eee; font:14px/1.5 system-ui; display:flex; height:100vh; overflow:hidden; }
#canvas-box { flex:1; position:relative; background:transparent; }
#canvas-box canvas { display:block; }
#panel { width:340px; background:#16213e; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
#panel h2 { font-size:15px; color:#e94560; margin:0 0 4px; }
#panel h3 { font-size:13px; color:#0f3460; background:#e94560; padding:4px 8px; margin:0; border-radius:3px; }
.group { display:flex; flex-direction:column; gap:6px; }
.row { display:flex; align-items:center; gap:8px; }
.row label { width:100px; font-size:12px; text-align:right; flex-shrink:0; }
.row input[type=range] { flex:1; accent-color:#e94560; }
.row .val { width:44px; font-size:11px; text-align:center; font-family:monospace; background:#0f3460; padding:1px 4px; border-radius:3px; }
.row button { font-size:11px; padding:1px 6px; background:#e94560; color:#fff; border:none; border-radius:3px; cursor:pointer; }
.row button:hover { background:#ff6b81; }
#log { position:fixed; bottom:8px; left:8px; font-size:11px; color:#888; max-width:500px; }
#fps { position:fixed; top:8px; right:8px; font-size:18px; color:#e94560; font-family:monospace; }
</style>
</head>
<body>
<div id="canvas-box"></div>
<div id="panel">
  <h2>🔧 小悠 v2 参数校准</h2>
  <div id="groups"></div>
  <div style="margin-top:8px;">
    <button id="btn-reset" style="width:100%;padding:8px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;">重置全部到 0.5</button>
  </div>
  <div style="margin-top:4px;">
    <button id="btn-zero" style="width:100%;padding:6px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;">全部归零</button>
  </div>
</div>
<div id="log">等待模型加载...</div>
<div id="fps"></div>

<script src="../node_modules/pixi.js/dist/pixi.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="../node_modules/pixi-live2d-display/dist/index.min.js"></script>
<script>
// ===== 参数定义 =====
const PARAM_GROUPS = [
  {
    name:'🎯 九轴 (角度, 0.5=中性, 范围 0-1)',
    params:[
      ['ParamAngleX','X IN 左右转'],
      ['ParamAngleY','Y IN 上下转'],
      ['ParamAngleZ','Z IN 歪头'],
      ['ParamAngleY2','DY 前倾'],
      ['ParamBodyAngleX','BODY X'],
      ['ParamBodyAngleY','BODY Y'],
      ['ParamBodyAngleZ','BODY Z'],
      ['ParamBreath','呼吸'],
    ]
  },
  {
    name:'👁 眼睛',
    params:[
      ['ParamEyeLOpen','左眼开闭'],
      ['ParamEyeROpen','右眼开闭'],
      ['ParamEyeLSmile','左眼微笑'],
      ['ParamEyeRSmile','右眼微笑'],
      ['ParamEyeBallX','眼珠X'],
      ['ParamEyeBallY','眼珠Y'],
      ['ParamBrowLY','左眉上下'],
      ['ParamBrowRY','右眉上下'],
      ['ParamBrowLForm','左眉变形'],
      ['ParamBrowRForm','右眉变形'],
    ]
  },
  {
    name:'👄 嘴巴',
    params:[
      ['ParamMouthOpenY','嘴开闭'],
      ['ParamMouthForm','嘴变形'],
      ['ParamMouthX','MouthX'],
      ['ParamCheekPuff','鼓脸'],
      ['ParamMouthShrug','MouthShrug'],
      ['ParamJawOpen','JawOpen'],
      ['ParamMouthPuckerWiden','PuckerWiden'],
      ['ParamEyeSquint','EyeSquint'],
      ['ParamMouthPressLipOpen','PressLipOpen'],
    ]
  },
  {
    name:'🐱 耳朵',
    params:[
      ['Param8','L兽耳表情'],
      ['Param27','L兽耳开闭'],
      ['Param28','L1'],
      ['Param30','L2'],
      ['Param31','R兽耳表情'],
      ['Param45','R兽耳开闭'],
      ['Param50','R1'],
      ['Param51','R2'],
    ]
  },
  {
    name:'🎭 表情开关 (0/1 二值)',
    params:[
      ['Param107','星星眼'],
      ['Param111','脸红'],
      ['Param110','黑脸'],
      ['Param113','哭哭'],
      ['Param135','晕晕眼'],
      ['Param83','扶脸'],
      ['Param54','流泪'],
      ['Param114','飞头'],
      ['Param44','记笔记'],
      ['Param93','拿手机'],
    ]
  },
  {
    name:'👔 部件开关 (0/1)',
    params:[
      ['Param85','水印开关'],
      ['Param38','外套开关'],
      ['Param55','帽子隐藏'],
      ['Param52','耳朵隐藏'],
      ['Param53','发夹隐藏'],
    ]
  },
  {
    name:'🦴 尾巴 (17节, 角度值)',
    params: Array.from({length:17}, (_,i) => [
      `Param_Angle_Rotation_${i+1}_ArtMesh212`,
      `[${i}]尾巴`
    ])
  },
];

// ===== 全局状态 =====
let model = null;
let core = null;
let allParams = {};
let sliders = {};

// ===== 构建 UI =====
function buildUI() {
  const container = document.getElementById('groups');
  PARAM_GROUPS.forEach((g, gi) => {
    const div = document.createElement('div'); div.className = 'group';
    const h3 = document.createElement('h3'); h3.textContent = g.name; div.appendChild(h3);
    g.params.forEach(([id, name]) => {
      const row = document.createElement('div'); row.className = 'row';
      const label = document.createElement('label'); label.textContent = name;
      const slider = document.createElement('input');
      slider.type = 'range'; slider.min = 0; slider.max = 1; slider.step = 0.01;
      slider.value = 0.5;
      slider.title = id;
      const val = document.createElement('span'); val.className = 'val'; val.textContent = '0.50';
      const btn = document.createElement('button'); btn.textContent = '↺'; btn.title = '重置到 0.5';

      slider.addEventListener('input', () => {
        val.textContent = Number(slider.value).toFixed(2);
        if (model) {
          try { core.setParameterValueById(id, Number(slider.value)); } catch(e){}
        }
      });
      btn.addEventListener('click', () => { slider.value = 0.5; val.textContent = '0.50'; slider.dispatchEvent(new Event('input')); });

      row.appendChild(label); row.appendChild(slider); row.appendChild(val); row.appendChild(btn);
      div.appendChild(row);
      sliders[id] = slider;
    });
    container.appendChild(div);
  });
}

// ===== 初始化 =====
async function init() {
  buildUI();

  const app = new PIXI.Application({
    view: document.createElement('canvas'),
    width: 600, height: 700,
    backgroundAlpha: 0,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  });
  document.getElementById('canvas-box').appendChild(app.view);

  // 缩放以适应
  app.view.style.position = 'absolute';
  app.view.style.left = '50%';
  app.view.style.top = '50%';
  app.view.style.transform = 'translate(-50%, -50%) scale(0.85)';

  try {
    log('加载模型中...');
    model = await PIXI.live2d.Live2DModel.from('../model/model.model3.json');
    app.stage.addChild(model);
    model.scale.set(0.08);
    model.x = 300;
    model.y = 180;
    core = model.internalModel.coreModel;

    // 读取初始参数值
    if (core && core.getParameterValueById) {
      PARAM_GROUPS.forEach(g => {
        g.params.forEach(([id]) => {
          try {
            const v = core.getParameterValueById(id);
            if (v !== undefined && sliders[id]) {
              sliders[id].value = v;
              sliders[id].dispatchEvent(new Event('input'));
            }
          } catch(e){}
        });
      });
    }
    log('✅ 模型加载完成！拖动滑块查看效果。');
  } catch(e) {
    log('❌ 加载失败: ' + e.message);
    console.error(e);
  }

  // FPS
  let lastTime = performance.now(), frames = 0;
  app.ticker.add(() => {
    frames++;
    const now = performance.now();
    if (now - lastTime >= 1000) {
      document.getElementById('fps').textContent = frames + ' FPS';
      frames = 0; lastTime = now;
    }
  });
}

function log(msg) { document.getElementById('log').textContent = msg; console.log(msg); }

document.getElementById('btn-reset').addEventListener('click', () => {
  Object.values(sliders).forEach(s => { s.value = 0.5; s.dispatchEvent(new Event('input')); });
  log('全部重置到 0.5');
});
document.getElementById('btn-zero').addEventListener('click', () => {
  Object.values(sliders).forEach(s => { s.value = 0; s.dispatchEvent(new Event('input')); });
  log('全部归零');
});

// 键盘快速测试
document.addEventListener('keydown', e => {
  if (e.key === '1') { // 快速测试: 星星眼+脸红
    if (core) {
      core.setParameterValueById('Param107', 1);
      core.setParameterValueById('Param111', 1);
      if (sliders['Param107']) sliders['Param107'].value = 1;
      if (sliders['Param111']) sliders['Param111'].value = 1;
      log('快速测试: 星星眼+脸红');
    }
  }
  if (e.key === '2') {
    if (core) {
      core.setParameterValueById('ParamAngleZ', 1);
      if (sliders['ParamAngleZ']) sliders['ParamAngleZ'].value = 1;
      log('快速测试: 歪头最大');
    }
  }
  if (e.key === '3') {
    if (core) {
      core.setParameterValueById('Param27', 0);
      core.setParameterValueById('Param45', 0);
      if (sliders['Param27']) sliders['Param27'].value = 0;
      if (sliders['Param45']) sliders['Param45'].value = 0;
      log('快速测试: 飞机耳');
    }
  }
  if (e.key === '0') {
    document.getElementById('btn-reset').click();
  }
});

init();
</script>
</body>
</html>
